plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu (dev-only, for testing + config screen API)
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

sourceSets {
    main {
        java {
            srcDir '../shared/src/main/java'
        }
    }
    test {
        java {
            srcDir '../shared/src/test/java'
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "hebrewfix"
    versionNumber = project.mod_version
    versionType = "release"
    uploadFile = jar
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
    }
}
